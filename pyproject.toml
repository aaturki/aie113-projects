[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-alerts"
version = "1.0.0"
description = "Card-fraud alerts with reasons: the SDA-AIE-113 fraud track as a service (SDAIA Academy)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The model file is a pickle: it only loads with the library versions that wrote it, so
    # training, tests and the image all use these exact versions.
    "scikit-learn==1.9.1",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "joblib==1.6.0",
    # The web service: plain FastAPI and uvicorn, without the [standard] extras (cloud CLI,
    # telemetry) that a small service does not need and an image would carry for nothing.
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "tzdata==2026.6",          # time zones on every machine, Windows included
]

[project.optional-dependencies]
# httpx2 drives FastAPI's TestClient (Starlette deprecates the older httpx for it).
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "httpx2==2.16.2", "ruff==0.17.6", "mypy==2.4.1",
       "import-linter==2.17", "pre-commit==4.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["tests"]           # so tests can import helpers.py
markers = [
    "unit: one rule, alone, in milliseconds",
    "integration: the API from the outside, with a stand-in model",
    "model: the real trained model (needs artifacts/ and the data)",
    "data: the downloaded data is what we expect (needs data/creditcard.csv)",
]

[tool.coverage.run]
branch = true
source = ["fraud_alerts"]
omit = ["*/training/*"]          # training is exercised by the model job, on the real data

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "S", "RET", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]    # tests assert, and use made-up practice tokens
"src/fraud_alerts/training/*" = ["S310"]   # downloads from one fixed https address
"scripts/smoke.py" = ["S310"]              # calls the service address it is given
"src/fraud_alerts/adapters/webhook.py" = ["S310"]   # posts only to the configured webhook
"scripts/fake_fraud_team.py" = ["S104"]    # listens on every interface, inside its container

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true      # joblib and scikit-learn ship no type stubs

[tool.importlinter]
root_package = "fraud_alerts"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layers"
type = "layers"
layers = [
    "fraud_alerts.api",
    "fraud_alerts.adapters",
    "fraud_alerts.service",
    "fraud_alerts.domain",
]

[[tool.importlinter.contracts]]
name = "Only the adapter and the training code touch the ML stack"
type = "forbidden"
source_modules = ["fraud_alerts.domain", "fraud_alerts.service", "fraud_alerts.api"]
forbidden_modules = ["sklearn", "joblib", "pandas", "numpy"]
allow_indirect_imports = true    # api reaches the adapter only in the composition root

[[tool.importlinter.contracts]]
name = "The rules and the use case know nothing of the web, the logs or the settings"
type = "forbidden"
source_modules = ["fraud_alerts.domain", "fraud_alerts.service"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "structlog", "fraud_alerts.config"]

[[tool.importlinter.contracts]]
name = "Adapters get their settings handed in, and know nothing of the web"
type = "forbidden"
source_modules = ["fraud_alerts.adapters"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "fraud_alerts.config"]
