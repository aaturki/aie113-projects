name: model

# Stage 1: prove that the reorganised code trains the notebook's model and gives the notebook's
# answers. The data is downloaded here, on GitHub's runner, and never stored in git.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"          # one thread: the same model on every run
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache the downloaded data (150 MB, the same file every time)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/creditcard.csv
          key: creditcard-csv-v1
      - run: pip install -e .
      - name: Train as the notebook does, then check against the notebook's answers
        run: python -m fraud_alerts.training.train
      - name: Keep the model and its facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: artifacts/
          if-no-files-found: ignore
