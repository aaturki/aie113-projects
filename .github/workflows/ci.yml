name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read                # the least the jobs need; a job asks for more only if it must

concurrency:
  group: ci-${{ github.ref }}   # a newer push to the same branch cancels the older run
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, with its release in a comment: a version tag can
# be moved to other code, a commit SHA cannot.
#
# The checklist, cheapest first:  secrets, lint, test  ->  model  ->  image  ->  publish (main)

jobs:
  secrets:
    # A secret is never in git: scan every commit ever made, not only the latest one, because a
    # secret deleted later is still in the history.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks over the whole history (its image pinned by digest)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  lint:
    # Style and simple mistakes, types at every seam, and the layer rules. Seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: The locked libraries, then the project and its tools
        run: |
          pip install --no-deps -r requirements.lock
          pip install -e ".[dev]"
      - name: Ruff (style and common mistakes)
        run: ruff check src tests scripts
      - name: Mypy, strict (the types at every seam)
        run: mypy src
      - name: The layer rules (inner layers never import outer ones)
        run: lint-imports

  test:
    # The fast tests: the rules, the use case and the API with a stand-in model. Seconds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: The locked libraries, then the project and its test tools
        run: |
          pip install --no-deps -r requirements.lock
          pip install -e ".[dev]"
          pip check
      - name: Unit and integration tests, with coverage
        run: pytest -m "unit or integration" --cov --cov-report=term-missing --cov-fail-under=95 --durations=5

  model:
    # Train exactly as the notebook does, on the real data, and prove the answers are the
    # notebook's. The data is downloaded here, on GitHub's computer, and never stored in git.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"      # one thread: the same model on every run
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Cache the downloaded data (150 MB, the same file every time)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/creditcard.csv
          key: creditcard-csv-v1
      - name: The locked libraries, the same as in the image, then the project and test tools
        run: |
          pip install --no-deps -r requirements.lock
          pip install -e ".[dev]"
          pip check
      - name: The runtime libraries are still exactly the locked ones
        run: |
          python - <<'EOF'
          from importlib.metadata import version
          wrong = []
          for line in open("requirements.lock"):
              if line.strip() and not line.startswith("#"):
                  name, locked = line.strip().split("==")
                  if version(name) != locked:
                      wrong.append(f"{name} {version(name)}, locked {locked}")
          print("\n".join(wrong) or "every locked library is installed at its locked version")
          raise SystemExit(1 if wrong else 0)
          EOF
      - name: Train as the notebook does, then check against the notebook's answers
        run: python -m fraud_alerts.training.train
      - name: Model behaviour, quality floor and data checks, on the real model and data
        run: pytest -m "model or data" -v --durations=5
      - name: Start the service on the model just trained, and try it
        run: |
          uvicorn fraud_alerts.api.app:create_app --factory --port 8000 --no-access-log \
            > service.log 2>&1 &
          python scripts/smoke.py http://127.0.0.1:8000 || { cat service.log; exit 1; }
          echo "--- the service's log"
          cat service.log
          echo "--- nothing the client sent may be in the log"
          if grep -E '1504\.93|4111111111111111|-6\.1061832734711' service.log; then
            echo "::error::A payment value or a card-like field name reached the log."
            exit 1
          fi
          echo "no payment values and no card-like field name in the log"
      - name: Keep the model and its facts for the image
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: artifacts/
          if-no-files-found: ignore

  image:
    # Pack the service and the model that just passed every check, then prove the container
    # starts with one command, reports healthy, answers, and runs as a normal user.
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: The model the model job made and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: artifacts/
      - name: Build the image (nothing cached yet)
        run: |
          start=$(date +%s%N)
          docker build --tag fraud-alerts:dev --build-arg GIT_SHA=${{ github.sha }} .
          echo "BUILD_MS=$(( ($(date +%s%N) - start) / 1000000 ))" >> "$GITHUB_ENV"
      - name: How big is it, and what makes up most of it?
        run: |
          docker image ls fraud-alerts:dev
          bytes=$(docker image inspect fraud-alerts:dev --format '{{.Size}}')
          echo "image size: $((bytes / 1000 / 1000)) MB to download (compressed)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- the layers, newest first (sizes unpacked)"
          docker history fraud-alerts:dev --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-120 | head -14
          echo "--- the biggest libraries"
          docker run --rm --entrypoint sh fraud-alerts:dev -c \
            'du -sh /opt/venv/lib/python3.12/site-packages/* | sort -h | tail -6; du -sh /app/artifacts /app/src'
      - name: Change one line of code and build again
        run: |
          echo "# one changed line" >> src/fraud_alerts/api/app.py
          start=$(date +%s%N)
          docker build --progress=plain --tag fraud-alerts:rebuilt . 2> rebuild.log
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "--- the steps Docker reused from its cache, and the ones it redid"
          grep -E '^#[0-9]+ (CACHED|\[runtime|\[builder)' rebuild.log | sort -u
          echo "first build ${BUILD_MS} ms; rebuild after a one-line change ${ms} ms" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          git checkout -- src/fraud_alerts/api/app.py
      - name: One command starts it; wait until the container reports healthy
        run: |
          start=$(date +%s)
          docker compose up --no-build --detach --wait --wait-timeout 90
          echo "healthy after $(( $(date +%s) - start )) s"
          docker compose ps
      - name: Smoke test through the container
        run: python3 scripts/smoke.py http://127.0.0.1:8000
      - name: Known vulnerabilities and secrets in the image (HIGH or CRITICAL with a fix fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2      # an immutable release, published after the March 2026 incident
          image-ref: fraud-alerts:dev
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true  # gate on what can be fixed today
          exit-code: "1"
          format: table
      - name: Not root, no extra tools, no secrets, cannot change its own files
        run: |
          echo "runs as: $(docker compose exec -T fraud-alerts id)"
          docker compose exec -T fraud-alerts sh -c '! command -v pip && ! command -v curl' \
            && echo "no pip and no curl inside"
          docker compose exec -T fraud-alerts ls /app /app/artifacts
          # One reviewed exception: GPG_KEY comes from the official Python base image. It is the
          # PUBLIC fingerprint of the key that signs Python's releases (python.org publishes
          # it), so it is allowed with exactly this value and no other.
          if docker compose exec -T fraud-alerts env \
              | grep -v -x 'GPG_KEY=7169605F62C751356D054A26A821E680E5FA6305' \
              | grep -i -E 'token|secret|password|key='; then
            echo "::error::A secret-like variable is inside the container."
            exit 1
          fi
          echo "no secret-like variable inside"
          if docker compose exec -T fraud-alerts sh -c 'touch /app/src/x' 2>/dev/null; then
            echo "::error::The service can change its own files."
            exit 1
          fi
          echo "its own files are read-only"
      - name: The container's log
        if: always()
        run: docker compose logs --no-color
      - name: Stop it
        if: always()
        run: docker compose down

  publish:
    # Delivery: only from main, only after every check passed, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, lint, test, model, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write           # push to GitHub's registry with this job's short-lived token
      id-token: write           # a short-lived OIDC identity signs the provenance: no stored key
      attestations: write       # record that signed provenance with GitHub
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: The model the model job made and checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: artifacts/
      - name: Image names must be lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, tagged with the commit (and main), never "latest" alone
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
      - name: Signed record of how and where the image was built (keyless, through OIDC)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: What was published
        run: |
          {
            echo "Published \`${IMAGE}:${GITHUB_SHA}\` and \`${IMAGE}:main\`"
            echo ""
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "Check where it came from: \`gh attestation verify oci://${IMAGE}:${GITHUB_SHA} --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
